openapi: 3.0.3
info:
  title: Delta Dental Task Management API
  version: 1.0.0
  description: |
    API discovered from the FastAPI service in `app/app.py`.
    This file documents the routes that are currently implemented in code.
    The repository also contains a product specification (`SPEC.md`) describing
    additional planned endpoints that are not yet present in the application.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: System
    description: Database initialization and service status endpoints.
  - name: Tasks
    description: Task creation endpoint.
paths:
  /:
    get:
      tags:
        - System
      summary: Ensure task table exists
      description: |
        Creates the `Tasks` table if it does not already exist. If SQL Server
        reports that the table already exists, the endpoint still returns a
        success response.
      operationId: ensureTasksTable
      responses:
        '200':
          description: Database initialization status
          content:
            application/json:
              schema:
                type: string
              examples:
                ready:
                  summary: Table ready
                  value: Add-Tasks API Ready.
                duplicate:
                  summary: Table already existed
                  value: Add-Tasks API Ready.
                error:
                  summary: Initialization failed
                  value: Error. Please check Logs.
  /tasks:
    post:
      tags:
        - Tasks
      summary: Create a task
      description: |
        Inserts a task title and description into the SQL Server `Tasks` table
        using a parameterized query.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
            examples:
              example:
                summary: Sample task payload
                value:
                  title: Review deployment logs
                  description: Check the AKS deployment for warnings and failed pods.
      responses:
        '200':
          description: Task created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
              examples:
                example:
                  summary: Task payload returned by the app
                  value:
                    title: Review deployment logs
                    description: Check the AKS deployment for warnings and failed pods.
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    Task:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
          description: Task title.
        description:
          type: string
          description: Detailed task description.
    Error:
      type: object
      properties:
        detail:
          type: string
          description: Human-readable error message.
    ValidationError:
      type: object
      description: Standard FastAPI/Pydantic validation error payload.
      properties:
        detail:
          type: array
          items:
            type: object
            required:
              - loc
              - msg
              - type
            properties:
              loc:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              msg:
                type: string
              type:
                type: string
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    InternalServerError:
      description: Server or database error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
