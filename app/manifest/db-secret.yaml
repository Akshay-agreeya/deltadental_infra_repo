# db-secret.yaml — Kubernetes Secret template for the database connection string.
#
# DO NOT commit real credentials here. Populate this secret outside of source
# control using one of the following approaches:
#
#   Option A (Azure Key Vault + Secrets Store CSI Driver):
#     Use a SecretProviderClass to sync the connection string from Azure Key Vault.
#
#   Option B (kubectl, for bootstrapping):
#     kubectl create secret generic db-connection \
#       --namespace=<your-namespace> \
#       --from-literal=connection-string='<your-real-connection-string>'
#
#   Option C (External Secrets Operator):
#     Use an ExternalSecret resource that pulls the value from Azure Key Vault.
#
# The template below is for reference only — replace <BASE64_ENCODED_VALUE>
# with the base64-encoded connection string before applying.
apiVersion: v1
kind: Secret
metadata:
  name: db-connection
type: Opaque
data:
  connection-string: <BASE64_ENCODED_VALUE>
