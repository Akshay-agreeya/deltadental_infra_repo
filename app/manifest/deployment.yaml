apiVersion: apps/v1
kind: Deployment
metadata:
  name: add-task-v4  # Unique Name
spec:
  replicas: 2
  selector:
    matchLabels:
      app: add-task-v4
  template:
    metadata:
      labels:
        app: add-task-v4
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: add-ui
        image: devtodoacrwestus.azurecr.io/microtodo-ui:v1
        # image: devtodoacrwestus.azurecr.io/todo-ui:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        env:
          - name: CONNECTION_STRING
            valueFrom:
              secretKeyRef:
                name: db-connection
                key: connection-string
        ports:
        - containerPort: 80 # Changed from 8000 to 80 to match Nginx

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: microtodo-add-v1 # Unique Name
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microtodo-add-v1
  template:
    metadata:
      labels:
        app: microtodo-add-v1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: micro-ui
        image: devtodoacrwestus.azurecr.io/microtodo-ui:v1
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        env:
          - name: CONNECTION_STRING
            valueFrom:
              secretKeyRef:
                name: db-connection
                key: connection-string
        ports:
        - containerPort: 8080 # Changed from 8080 to 80 to match Nginx
